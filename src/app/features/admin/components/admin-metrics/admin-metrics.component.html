<div class="grid grid-cols-1 gap-6 md:grid-cols-3">
  @for (metric of metrics(); track metric.title) {
    <article class="flex items-center gap-4 rounded-xl border border-gray-100 bg-white p-6 shadow-sm">
      <div class="rounded-lg p-3" [class]="metric.iconClass">
        <i [class]="metric.icon + ' text-2xl'"></i>
      </div>
      <div>
        <p class="text-xs font-bold uppercase text-gray-500">{{ metric.title }}</p>
        <p class="text-2xl font-bold text-gray-800">{{ metric.value }}</p>
      </div>
    </article>
  }
</div>

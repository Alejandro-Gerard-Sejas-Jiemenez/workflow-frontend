<div class="grid grid-cols-1 gap-4 md:grid-cols-3">
  @for (metric of metrics(); track metric.title) {
    <article class="flex items-center gap-4 rounded-2xl border border-slate-200 bg-white px-5 py-4 shadow-sm shadow-slate-200/60">
      <div class="rounded-2xl p-3.5" [class]="metric.iconClass">
        <i [class]="metric.icon + ' text-xl'"></i>
      </div>
      <div class="min-w-0">
        <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-500">{{ metric.title }}</p>
        <p class="mt-1 text-3xl font-semibold leading-none text-slate-900">{{ metric.value }}</p>
      </div>
    </article>
  }
</div>

<section class="rounded-3xl border border-slate-200 bg-white shadow-sm overflow-hidden">
  <div class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
    <h2 class="text-lg font-semibold text-slate-900">Gestión de Departamentos</h2>
    <button
      (click)="openCreateModal()"
      class="inline-flex h-9 items-center gap-2 rounded-xl bg-violet-600 px-4 text-sm font-semibold text-white transition hover:bg-violet-700">
      <i class="pi pi-plus text-xs"></i>
      <span>Nuevo</span>
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left">
      <thead class="bg-slate-50 text-xs font-semibold uppercase tracking-wider text-slate-500">
        <tr>
          <th class="px-6 py-3">Nombre</th>
          <th class="px-6 py-3">Descripción</th>
          <th class="px-6 py-3">Estado</th>
          <th class="px-6 py-3 text-right">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (dept of departments; track dept.id) {
          <tr class="hover:bg-slate-50 transition">
            <td class="px-6 py-4 font-medium text-slate-900">{{ dept.nombre }}</td>
            <td class="px-6 py-4 text-sm text-slate-500">{{ dept.descripcion || '—' }}</td>
            <td class="px-6 py-4">
              <span 
                class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-medium"
                [ngClass]="dept.estado === 'ACTIVO' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                {{ dept.estado }}
              </span>
            </td>
            <td class="px-6 py-4 text-right">
              <div class="flex justify-end gap-2">
                <button (click)="openEditModal(dept)" class="text-slate-400 hover:text-violet-600 transition">
                  <i class="pi pi-pencil"></i>
                </button>
                <button (click)="delete(dept.id!)" class="text-slate-400 hover:text-red-600 transition">
                  <i class="pi pi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>

<!-- Modal Simple -->
@if (isModalOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
    <div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl">
      <h3 class="text-xl font-bold text-slate-900 mb-6">
        {{ isEditing ? 'Editar Departamento' : 'Nuevo Departamento' }}
      </h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
          <input 
            [(ngModel)]="currentDept.nombre"
            class="h-11 w-full rounded-xl border border-slate-200 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-violet-300 focus:ring-2 focus:ring-violet-100"
            placeholder="Ej: Marketing" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
          <textarea 
            [(ngModel)]="currentDept.descripcion"
            rows="3"
            class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-800 outline-none transition focus:border-violet-300 focus:ring-2 focus:ring-violet-100"
            placeholder="Breve descripción..."></textarea>
        </div>
      </div>

      <div class="mt-8 flex gap-3">
        <button 
          (click)="isModalOpen = false"
          class="flex-1 h-11 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition">
          Cancelar
        </button>
        <button 
          (click)="save()"
          [disabled]="!currentDept.nombre.trim()"
          class="flex-1 h-11 rounded-xl bg-violet-600 text-sm font-semibold text-white hover:bg-violet-700 transition disabled:opacity-50">
          Guardar
        </button>
      </div>
    </div>
  </div>
}

<div class="min-h-screen bg-slate-50">
  <app-page-header
    icon="pi pi-cog"
    title="Administración central"
    subtitle="Gestiona usuarios, roles y accesos del sistema."
    [badgeText]="'Panel de control: ' + ((user$ | async)?.nombre ?? 'Admin')"
    actionLabel="Salir"
    (action)="logout()" />

  <main class="flex flex-col gap-6 px-6 py-8 xl:px-10">
    @if (dashboard$ | async; as dashboard) {
      <div class="grid gap-6 2xl:grid-cols-[0.78fr_1.22fr]">
        <app-admin-user-creator
          [roles]="dashboard.roles"
          (createUser)="createUser($event)" />
        <app-admin-user-management
          [roles]="dashboard.roles"
          [activeUsers]="dashboard.activeUsers"
          [inactiveUsers]="dashboard.inactiveUserList"
          (updateUser)="updateUser($event)"
          (deactivateUser)="deactivateUser($event)"
          (restoreUser)="restoreUser($event)" />
      </div>
    } @else {
      <div class="grid gap-6 2xl:grid-cols-[0.78fr_1.22fr]">
        <app-admin-user-creator [roles]="emptyState.roles" />
        <app-admin-user-management
          [roles]="emptyState.roles"
          [activeUsers]="emptyState.activeUsers"
          [inactiveUsers]="emptyState.inactiveUserList" />
      </div>
    }
  </main>
</div>

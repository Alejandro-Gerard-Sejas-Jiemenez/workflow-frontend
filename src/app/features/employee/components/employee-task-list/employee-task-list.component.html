<div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
  @for (task of tasks(); track task.id) {
    <div 
      class="group relative flex flex-col overflow-hidden rounded-[2rem] border bg-white p-1 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-violet-200/50"
      [class]="task.colorClass">
      
      <div class="flex flex-1 flex-col p-6">
        <div class="mb-4 flex items-center justify-between">
          <span 
            class="rounded-full px-3 py-1 text-[10px] font-bold uppercase tracking-widest"
            [ngClass]="{
              'bg-red-100 text-red-600': task.prioridad === 'ALTA',
              'bg-blue-100 text-blue-600': task.prioridad === 'BAJA',
              'bg-amber-100 text-amber-600': task.estado === 'PENDIENTE_VERIFICACION',
              'bg-violet-100 text-violet-600': task.prioridad === 'MEDIA' && task.estado !== 'PENDIENTE_VERIFICACION'
            }">
            {{ task.estado === 'PENDIENTE_VERIFICACION' ? 'Por Verificar' : task.prioridad }}
          </span>
          <span class="text-[11px] font-medium text-slate-400">
            {{ task.fecha | date:'mediumDate' }}
          </span>
        </div>

        <h3 class="mb-2 text-xl font-bold text-slate-900 group-hover:text-violet-600 transition-colors">
          {{ task.workflowName }}
        </h3>
        
        <p class="mb-6 text-sm leading-relaxed text-slate-500">
          ID: <span class="font-mono text-xs">{{ task.id.substring(0, 12) }}</span><br>
          Estado actual: <span class="font-semibold text-slate-700">{{ task.estado }}</span>
        </p>

        <div class="mt-auto pt-6 border-t border-slate-50">
          <button 
            (click)="atender(task.id)"
            class="flex w-full items-center justify-center gap-2 rounded-2xl bg-slate-900 px-4 py-3 text-sm font-bold text-white transition-all hover:bg-violet-600 active:scale-95 shadow-lg shadow-slate-200">
            <i class="pi pi-external-link text-xs"></i>
            Atender solicitud
          </button>
        </div>
      </div>
      
      <!-- Subtle background element -->
      <div class="absolute -right-4 -top-4 h-24 w-24 rounded-full bg-slate-50 opacity-50 transition-transform duration-500 group-hover:scale-150"></div>
    </div>
  }
</div>

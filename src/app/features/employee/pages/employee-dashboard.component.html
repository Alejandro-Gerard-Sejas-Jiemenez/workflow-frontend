<div class="flex h-screen flex-col bg-gray-50">
  <app-page-header
    icon="pi pi-briefcase"
    title="Portal del Funcionario"
    subtitle="Revisa y ejecuta tus tareas pendientes."
    [badgeText]="'Bandeja de entrada: ' + ((user$ | async)?.nombre ?? 'Usuario')"
    actionLabel="Salir"
    (action)="logout()" />

  <main class="mx-auto w-full max-w-7xl p-8">
    <h2 class="mb-6 text-2xl font-bold text-gray-800">Mis Tareas Pendientes</h2>
    <app-employee-task-list [tasks]="tasks" />
  </main>
</div>

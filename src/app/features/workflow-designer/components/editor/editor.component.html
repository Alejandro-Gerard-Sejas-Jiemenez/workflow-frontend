@if (workflow()) {
<div class="diagram-editor-layout h-full">
  <div class="editor-shell h-full flex">
    <!-- Panel Izquierdo Modular -->
    <app-workflow-designer-sidebar [paletteItems]="paletteItems" [supportedPatterns]="supportedPatterns"
      [isGeneratingAi]="isGeneratingAi()" [aiProposal]="aiProposal()" (insertPattern)="insertFlowPattern($event)"
      (proposeWithAi)="proposeWithAi($event)" (applyAiProposal)="applyAiProposal()" />

    <section class="editor-main flex-1 relative bg-slate-50">
      <!-- Floating Tools Toolbar -->
      <div class="absolute top-4 right-4 z-10 flex gap-2 items-center">
        <!-- Botón Guardar -->
        <button (click)="manualSave()" 
                class="h-10 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-lg border border-indigo-500 flex items-center gap-2 transition-all active:scale-95" 
                title="Guardar cambios en el servidor">
          <i class="pi pi-save"></i>
          <span>Guardar</span>
        </button>
        
        <div class="w-px bg-slate-300 mx-1 h-6"></div>

        <button (click)="zoomOut()"
          class="h-10 w-10 bg-white rounded-xl shadow border border-slate-200 flex items-center justify-center text-slate-600 hover:text-indigo-600 transition-colors"
          title="Alejar">
          <i class="pi pi-minus"></i>
        </button>
        <span
          class="h-10 px-3 bg-white rounded-xl shadow border border-slate-200 flex items-center justify-center text-sm font-bold text-slate-700">
          {{ stateService.zoomLevel() }}%
        </span>
        <button (click)="zoomIn()"
          class="h-10 w-10 bg-white rounded-xl shadow border border-slate-200 flex items-center justify-center text-slate-600 hover:text-indigo-600 transition-colors"
          title="Acercar">
          <i class="pi pi-plus"></i>
        </button>
        <div class="w-px bg-slate-300 mx-1 my-2"></div>
        <button (click)="fitToScreen()"
          class="h-10 w-10 bg-white rounded-xl shadow border border-slate-200 flex items-center justify-center text-slate-600 hover:text-indigo-600 transition-colors"
          title="Ajustar a Pantalla">
          <i class="pi pi-expand"></i>
        </button>
        <button (click)="relayout()"
          class="h-10 w-10 bg-white rounded-xl shadow border border-slate-200 flex items-center justify-center text-slate-600 hover:text-indigo-600 transition-colors"
          title="Auto-diseño">
          <i class="pi pi-sitemap"></i>
        </button>
      </div>

      <!-- Contextual Connect Button -->
      @if (selection.nodes.length === 2) {
      <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 animate-fadeinup">
        <button (click)="actionService.connectSelectedNodes()"
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-full shadow-xl font-bold flex items-center gap-3 transition-transform transform hover:scale-105">
          <i class="pi pi-link text-lg"></i>
          <span>Conectar Nodos (C)</span>
        </button>
      </div>
      }

      <div class="activity-board h-full w-full">
        <div class="activity-board__custom-bg"></div>
        <div class="activity-board__canvas h-full w-full" (window:keydown)="onGlobalKeyDown($event)">
          <ng-diagram #diagramCanvas [model]="model()" [config]="diagramConfig" class="diagram-surface h-full w-full"
            [nodeTemplateMap]="nodeTemplateMap" [edgeTemplateMap]="edgeTemplateMap" (diagramInit)="onDiagramInit()"
            (select)="onSelectionChanged($event)">
          </ng-diagram>

        </div>
      </div>

      <!-- Panel de Propiedades Derecho Flotante -->
      @if (selectedNode || selectedEdge) {
        <app-workflow-designer-properties-panel 
          [node]="selectedNode"
          [edge]="selectedEdge" />
      }
    </section>
  </div>
</div>
} @else {
<div class="editor-empty h-full flex items-center justify-center bg-white">Cargando workflow...</div>
}

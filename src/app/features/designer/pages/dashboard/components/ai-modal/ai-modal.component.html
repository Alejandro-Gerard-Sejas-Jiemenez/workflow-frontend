<p-dialog 
  [visible]="isVisible()" 
  (visibleChange)="isVisible.set($event)"
  [modal]="true" 
  [header]="'Crear Workflow con IA Gemini'" 
  [style]="{width: '500px', 'max-width': '95vw'}"
  [draggable]="false"
  [resizable]="false"
  class="designer-dialog">
  
  <div class="grid gap-6 py-4">
    <div class="space-y-3">
      <label class="text-sm font-medium text-slate-700">Describe tu proceso</label>
      <textarea
        [(ngModel)]="aiPrompt"
        rows="3"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-violet-300 focus:ring-2 focus:ring-violet-100"
        placeholder="Ej: Proceso de solicitud de vacaciones..."></textarea>
      <p-button
        label="Generar desde Texto"
        icon="pi pi-send"
        styleClass="p-button-violet w-full"
        [disabled]="isAiGenerating || !aiPrompt.trim()"
        (onClick)="generateFromPrompt()">
      </p-button>
    </div>

    <div class="flex items-center gap-4 py-2">
      <div class="h-px flex-grow bg-slate-100"></div>
      <span class="text-xs font-medium text-slate-400 uppercase tracking-widest">o usa</span>
      <div class="h-px flex-grow bg-slate-100"></div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-2">
        <p-button
          [label]="isRecording ? 'Detener' : 'Grabar Voz'"
          [icon]="isRecording ? 'pi pi-stop' : 'pi pi-microphone'"
          [styleClass]="isRecording ? 'p-button-danger w-full' : 'p-button-outlined p-button-violet w-full'"
          [disabled]="isAiGenerating"
          (onClick)="toggleRecording()">
        </p-button>
      </div>

      <div class="space-y-2">
        <p-fileUpload 
          mode="basic" 
          chooseLabel="Subir PDF" 
          chooseIcon="pi pi-file-pdf"
          accept="application/pdf"
          [maxFileSize]="5000000"
          styleClass="p-button-outlined p-button-violet w-full"
          [disabled]="isAiGenerating"
          (onSelect)="onPdfUpload($event)">
        </p-fileUpload>
      </div>
    </div>

    @if (isAiGenerating) {
      <div class="mt-4 flex flex-col items-center justify-center p-6 bg-violet-50 rounded-2xl animate-pulse">
        <i class="pi pi-spin pi-sparkles text-2xl text-violet-600 mb-3"></i>
        <p class="text-sm font-medium text-violet-700">Gemini está diseñando tu workflow...</p>
      </div>
    }
  </div>
</p-dialog>

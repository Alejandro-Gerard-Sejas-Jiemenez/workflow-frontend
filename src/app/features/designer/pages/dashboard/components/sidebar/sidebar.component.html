<aside class="rounded-3xl border border-slate-200 bg-white p-7 shadow-sm">
  <h2 class="text-xl font-semibold tracking-tight text-slate-900">Nuevo workflow</h2>
  <p class="mt-2 text-xs leading-6 text-slate-500 sm:text-sm">
    Dale un nombre y descripción para empezar a diseñar.
  </p>

  <div class="mt-7 grid gap-4">
    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700">Nombre</label>
      <input
        [(ngModel)]="createModel.nombre"
        class="h-11 w-full rounded-xl border border-slate-200 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-violet-300 focus:ring-2 focus:ring-violet-100"
        placeholder="Ej: Gestión de Vacaciones" />
    </div>

    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700">Descripción</label>
      <textarea
        [(ngModel)]="createModel.descripcion"
        rows="4"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-violet-300 focus:ring-2 focus:ring-violet-100"
        placeholder="Describe brevemente el flujo..."></textarea>
    </div>

    <button
      type="button"
      class="inline-flex h-11 items-center justify-center rounded-xl bg-violet-600 px-4 text-sm font-semibold text-white transition hover:bg-violet-700 disabled:bg-slate-200 disabled:text-slate-400"
      [disabled]="isCreating() || !createModel.nombre.trim() || !createModel.descripcion.trim()"
      (click)="onSubmit()">
      {{ isCreating() ? 'Creando...' : 'Crear workflow' }}
    </button>

    @if (createError()) {
      <p class="text-xs text-red-600">{{ createError() }}</p>
    }
  </div>

  <div class="mt-8 pt-8 border-t border-slate-100">
    <h3 class="text-sm font-semibold text-slate-900 mb-4">Opciones Avanzadas</h3>
    <button
      type="button"
      class="inline-flex w-full h-11 items-center justify-center rounded-xl bg-violet-50 border border-violet-200 px-4 text-sm font-semibold text-violet-700 transition hover:bg-violet-100"
      (click)="openAi.emit()">
      <i class="pi pi-sparkles mr-2"></i>
      Generar con IA (Gemini)
    </button>
  </div>
</aside>
